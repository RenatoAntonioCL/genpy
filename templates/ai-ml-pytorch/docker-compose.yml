services:

  ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "{{PROJECT_NAME}}-ml"
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./notebooks:/app/notebooks
      - model_data:/app/models
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    networks:
      - ml-network

volumes:
  model_data:

networks:
  ml-network:
    driver: bridge
