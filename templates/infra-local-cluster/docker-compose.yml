
services:
  # 🌐 El Director de Orquesta: Proxy Inverso Traefik
  reverse_proxy:
    image: traefik:v2.10
    container_name: ${PROJECT_NAME}_proxy
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"       # Puerto para tus aplicaciones de desarrollo
      - "8082:8080"   # Panel de control visual de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Permite a Traefik escuchar eventos de Docker
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - cluster_network

  # ⚙️ Microservicio de Prueba A (Frontend ficticio)
  frontend_mock:
    image: nginxdemos/hello:plain-text
    container_name: ${PROJECT_NAME}_service_frontend
    labels:
      - "traefik.enable=true"
      # Le dice a Traefik que si el usuario entra a app.localhost, lo mande aquí
      - "traefik.http.routers.frontend.rule=Host(\`app.localhost\`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - cluster_network

  # ⚙️ Microservicio de Prueba B (Backend ficticio)
  backend_mock:
    image: nginxdemos/hello:plain-text
    container_name: ${PROJECT_NAME}_service_backend
    labels:
      - "traefik.enable=true"
      # Le dice a Traefik que si el usuario entra a api.localhost, lo mande aquí
      - "traefik.http.routers.backend.rule=Host(\`api.localhost\`)"
      - "traefik.http.services.backend.loadbalancer.server.port=80"
    networks:
      - cluster_network

networks:
  cluster_network:
    driver: bridge