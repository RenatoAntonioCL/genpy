services:

  # ── Pipeline RAG ──────────────────────────────────────────────────────────────
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME}-rag"
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data        # documentos fuente para embeddings
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_PATH: /app/data/chroma
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge