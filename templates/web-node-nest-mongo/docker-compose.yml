services:

  # ── API NestJS ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: "${COMPOSE_PROJECT_NAME}-api"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/${COMPOSE_PROJECT_NAME}
      NODE_ENV: development
    depends_on:
      - mongo
    networks:
      - app-network

  # ── MongoDB ───────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: "${COMPOSE_PROJECT_NAME}-mongo"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge