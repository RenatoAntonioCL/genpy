name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Bash syntax
        run: |
          find bin lib scripts tests -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done

      - name: Validate docker-compose templates
        run: |
          for f in templates/*/docker-compose.yml; do
            docker compose -f "$f" config -q
          done

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          export GUARDIAN_NON_INTERACTIVE=1
          bash tests/unit/test_resolver.sh
          bash tests/unit/test_guardians.sh
          bash tests/unit/test_assembler.sh
          bash tests/unit/test_checkpoint.sh
